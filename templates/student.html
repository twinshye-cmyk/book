{% extends 'base.html' %}{% block content %}<section class="card"><div class="eyebrow">학생용 독후감 제출</div><h1>읽은 책에 대한 생각을 들려주세요</h1><p class="sub">아래 내용을 작성하고 제출 버튼을 누르세요. 제출 후에는 학생이 수정할 수 없습니다.</p><form method="post" action="{{url_for('submit')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="grid"><div><label for="student_id">학번 *</label><input id="student_id" name="student_id" maxlength="30" required placeholder="예: 20315"></div><div><label for="student_name">이름 *</label><input id="student_name" name="student_name" maxlength="60" required placeholder="예: 김하늘"></div></div><label for="book_title">책 제목 *</label><input id="book_title" name="book_title" maxlength="200" required placeholder="읽은 책의 제목"><label for="author">작가 *</label><input id="author" name="author" maxlength="120" required placeholder="책을 쓴 사람"><label for="review">전체적인 감상문 *</label><textarea id="review" name="review" minlength="200" maxlength="10000" rows="12" required placeholder="인상 깊었던 장면, 책을 읽고 느낀 점, 새롭게 생각하게 된 점 등을 자유롭게 작성해 보세요."></textarea><p class="hint">최소 200자, 최대 10,000자 · 제출 전에 내용을 확인해 주세요.</p><button class="btn full" type="submit">독후감 제출하기</button></form></section>{% endblock %}
