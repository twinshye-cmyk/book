<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}우리 반 독서 기록장{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><div class="shell header"><a class="brand" href="{{ url_for('index') }}">📚 우리 반 독서 기록장</a><a class="nav" href="{{ url_for('dashboard') if session.get('admin') else url_for('login') }}">교사용 관리실</a></div></header><main class="shell">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>우리 반 독서 기록장 · 제출한 내용은 교사만 확인할 수 있습니다.</footer></body></html>
