{% extends 'base.html' %}{% block content %}<section class="card"><a class="back" href="{{url_for('dashboard')}}">← 목록으로</a><h1>{{entry.book_title}}</h1><div class="meta"><span>학번: {{entry.student_id}}</span><span>이름: {{entry.student_name}}</span><span>작가: {{entry.author}}</span><span>제출: {{entry.created_at}}</span></div><h2>전체적인 감상문</h2><div class="review">{{entry.review}}</div><form method="post" action="{{url_for('delete',entry_id=entry.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn danger" type="submit">이 독후감 삭제</button></form></section>{% endblock %}
